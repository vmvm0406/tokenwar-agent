<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<link rel="stylesheet" href="fonts/black-han-sans/index.css">
<style>
@font-face{font-family:'Wanted';src:url('fonts/WantedSans-Medium.otf');font-weight:500}
@font-face{font-family:'Wanted';src:url('fonts/WantedSans-Bold.otf');font-weight:700}
@font-face{font-family:'Wanted';src:url('fonts/WantedSans-ExtraBold.otf');font-weight:800}
@font-face{font-family:'Mono';src:url('fonts/jetbrains-mono-latin-700-normal.woff2');font-weight:700}
:root{--g:#00FF66;--ink:#0A0B0A;--ink2:#15191A;--pa:#F2F4F0;--mint:#8FA89A;--olive:#33503F}
*{box-sizing:border-box;margin:0}
html,body{width:1080px;height:1920px;background:var(--ink);overflow:hidden}
#s{position:absolute;inset:0;font-family:'Wanted',sans-serif;color:var(--pa);word-break:keep-all}
.d{font-family:'Black Han Sans','Wanted',sans-serif;font-weight:400}
.m{font-family:'Mono','Wanted',monospace;font-weight:700;letter-spacing:.04em}
.abs{position:absolute}
.plate{position:absolute;background:var(--g);color:var(--ink);transform-origin:50% 50%}
.plate .in{display:flex;align-items:center;justify-content:center;height:100%;transform:skewX(14deg)}
.slash{position:absolute;width:60px;height:900px;background:var(--g);transform:skewX(-14deg)}
.row{position:absolute;left:56px;right:56px;height:132px;display:flex;transform-origin:50% 0}
.row .n{width:132px;background:var(--g);color:var(--ink);display:flex;align-items:center;justify-content:center;font-size:64px;position:relative}
.row .t{flex:1;background:var(--pa);color:var(--ink);display:flex;align-items:center;padding:0 30px;font-size:46px}
.row .ck{position:absolute;inset:0;background:var(--ink);color:var(--g);display:flex;align-items:center;justify-content:center;font-size:76px}
.band{position:absolute;top:0;bottom:0;width:103px;display:flex}
.band i{display:block;height:100%}
#tab{position:absolute;left:56px;top:1352px;height:52px;background:var(--g);color:var(--ink);display:flex;align-items:center;gap:14px;padding:0 18px;overflow:hidden}
#tab .k{font-size:34px}#tab .e{font-size:20px}
#strap{position:absolute;left:56px;right:56px;top:1404px;height:168px;background:var(--pa);color:var(--ink);overflow:hidden}
#strap .end{position:absolute;right:0;top:0;bottom:0;width:22px;background:var(--ink);border-left:6px solid var(--g)}
.sw{position:absolute;left:30px;right:50px;top:0;height:168px;display:flex;flex-direction:column;justify-content:center}
.sw .h{font-size:52px;line-height:1.12;white-space:nowrap}
.sw .e{font-size:26px;font-weight:700;color:var(--olive);margin-top:10px}
#src{position:absolute;right:56px;top:1592px;font-size:20px;color:var(--mint);opacity:.9}
.stamp{position:absolute;padding:14px 26px 8px;font-size:64px;background:var(--g);color:var(--ink);transform-origin:50% 50%}
.card{background:var(--ink2);border-top:6px solid var(--g);padding:28px 28px;font-size:42px;font-weight:700;line-height:1.3}
.chk{display:flex;align-items:center;gap:30px;padding:34px 0;border-top:2px solid #26302B;font-size:52px;font-weight:700}
.chk:last-child{border-bottom:2px solid #26302B}
.box{width:62px;height:62px;border:4px solid var(--mint);position:relative;flex:none}
.box b{position:absolute;inset:-4px;background:var(--g);color:var(--ink);display:flex;align-items:center;justify-content:center;font-family:'Black Han Sans';font-weight:400;font-size:46px}
.line{display:flex;gap:24px;align-items:baseline;font-size:50px;font-weight:700;line-height:1.35;padding:16px 0}
.line i{display:block;width:16px;height:16px;background:var(--g);flex:none;transform:translateY(-6px)}
</style></head>
<body><div id="s"></div>
<script src="main.js"></script>
</body></html>
