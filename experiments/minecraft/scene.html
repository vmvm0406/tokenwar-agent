<body><canvas id="c" width="1080" height="1920"></canvas>
<script>
// 마인크래프트 블록 파고들기 장면 그리기 (운영자 2026-11-22). 블록 렌더 이미지(minecraft.wiki) + 우리가 그린 픽셀 그림.
// window.renderAt(sceneIndex, t, d, sub) / window.renderTimeline(T) (make.py가 timeline을 넣음)
const W = 1080, H = 1920;
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
ctx.imageSmoothingEnabled = false;
const IMG = {};
const NAMES = {sp1: 'Sponge_JE1_BE1', sp2: 'Sponge_JE2_BE2', sp3: 'Sponge_JE3_BE3', wet: 'Wet_Sponge_JE2_BE2', water: 'Water_JE16',
  grass: 'Grass_Block_JE7_BE6', obs: 'Obsidian_JE3_BE2', furnace: 'Furnace_JE4', nether: 'Netherrack_JE4_BE2',
  pris: 'Prismarine_JE2_BE2', sand: 'Sand_JE5_BE3', tnt: 'TNT_JE3_BE2', eg: 'Elder_Guardian_JE2_BE2', cobble: 'Cobblestone_JE5_BE3', lava: 'Lava_JE19', pick: 'Diamond_Pickaxe_JE3_BE3', gun: 'Gunpowder_JE2_BE2', sstone: 'Sandstone_JE6_BE3', plate: 'Stone_Pressure_Plate_JE5_BE2', bedrock: 'Bedrock_JE2_BE2', farmland: 'Farmland_JE4_BE6', seeds: 'Wheat_Seeds_JE1_BE1', dirt: 'Dirt_JE2_BE2', stone: 'Stone_JE5_BE3', steve: 'Steve_classic_JE6', nrc: 'Nether_Reactor_Core_BE1', nrc2: 'Nether_Reactor_Core_BE2', nrci: 'Initialized_Nether_Reactor_Core_BE1', nrcf: 'Finished_Nether_Reactor_Core_BE1', gold: 'Block_of_Gold_JE6_BE3', glow: 'Glowstone_Dust_JE2_BE2', quartz: 'Nether_Quartz_JE2_BE2', iron: 'Iron_Ingot_JE3_BE2', dia: 'Diamond_JE3_BE3', soulsand: 'Soul_Sand_JE2_BE2', pig: 'Zombified_Piglin_JE2', skull: 'Wither_Skeleton_Skull_(S)_JE2', wither: 'Wither_JE2_BE2', sfire: 'Soul_Fire_BE', fire: 'Fire_JE7', sculk: 'Sculk_JE1_BE1', bubble: 'Bubble_Column_JE1_BE1'};
window.ready = Promise.all([
  ...Object.entries(NAMES).map(([k, n]) => new Promise(r => { const i = new Image(); i.onload = r; i.src = `assets/blocks/${n}.png`; IMG[k] = i; })),
  document.fonts.load('80px G14'), document.fonts.load('66px G11B')]);

// ---------- 도구 ----------
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const ease = x => { x = clamp(x); return 1 - Math.pow(1 - x, 3); };
const back = x => { x = clamp(x); const c = 1.70158; return 1 + (c + 1) * Math.pow(x - 1, 3) + c * Math.pow(x - 1, 2); };
const lerp = (a, b, x) => a + (b - a) * x;
function rnd(seed) { let s = seed * 9301 + 49297; return () => { s = (s * 9301 + 49297) % 233280; return s / 233280; }; }
const snap = v => Math.round(v / 6) * 6;   // 픽셀 느낌: 위치를 6px 칸에 맞춤

// 아이소 블록: 이미지 정육면체 폭 268px(16~284), 윗꼭짓점 (150,1), 반폭 134, 윗면 반높이 66.5, 세로 모서리 165
function cube(img, i, j, z, S, ox, oy, a = 1, sc = 1) {
  const k = S / 268, x = ox + (i - j) * 134 * k, y = oy + (i + j) * 66.5 * k - z * 165 * k;
  ctx.globalAlpha = a;
  const s = 300 * k * sc;
  ctx.drawImage(img, x - 150 * k * sc, y - 1 * k * sc + (1 - sc) * 150 * k, s, s);
  ctx.globalAlpha = 1;
}
function bg() {   // 모든 장면 배경 색 하나로 통일 (운영자 2026-11-23 '색 통일')
  const c1 = '#101318', c2 = '#181c24', grid = 0.05;
  ctx.save(); ctx.setTransform(1, 0, 0, 1, 0, 0);   // 배경·격자는 그림 이동·축소와 상관없이 화면에 고정 (운영자 2026-11-23 '격자가 안 맞잖아')
  const g = ctx.createLinearGradient(0, 0, 0, H); g.addColorStop(0, c1); g.addColorStop(1, c2);
  ctx.fillStyle = g; ctx.fillRect(0, -300, W, H + 600);
  ctx.fillStyle = `rgba(255,255,255,${grid})`;
  for (let x = 0; x < W; x += 60) ctx.fillRect(x, -300, 3, H + 600);
  for (let y = -300; y < H + 300; y += 60) ctx.fillRect(0, y, W, 3);
  ctx.restore();
}
function flash(color) { ctx.save(); ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.fillStyle = color; ctx.fillRect(0, 0, W, H); ctx.restore(); }   // 화면 전체 번쩍 (그림 축소와 상관없이)
function text(s, x, y, size = 84, color = '#fff', font = 'G14', align = 'center', stroke = 12) {
  ctx.font = `${size}px ${font}`; ctx.textAlign = align; ctx.textBaseline = 'alphabetic';
  if (stroke) { ctx.lineWidth = stroke; ctx.strokeStyle = '#000'; ctx.lineJoin = 'miter'; ctx.strokeText(s, x, y); }
  ctx.fillStyle = color; ctx.fillText(s, x, y);
}
// 문자열 지도로 픽셀 그림 (우리 그림). '.' = 빈칸
function sprite(map, pal, cx, cy, px, a = 1) {
  const h = map.length, w = map[0].length;
  ctx.globalAlpha = a;
  for (let r = 0; r < h; r++) for (let c = 0; c < w; c++) {
    const ch = map[r][c]; if (ch === '.' || !pal[ch]) continue;
    ctx.fillStyle = pal[ch]; ctx.fillRect(Math.round(cx - w * px / 2 + c * px), Math.round(cy - h * px / 2 + r * px), px, px);
  }
  ctx.globalAlpha = 1;
}
function box(x, y, w, h, fill, edge = '#000', e = 6) {
  ctx.fillStyle = edge; ctx.fillRect(x - e, y - e, w + 2 * e, h + 2 * e); ctx.fillStyle = fill; ctx.fillRect(x, y, w, h);
}

// ---------- 연도 띠 (우리 표시) ----------
let YEARS = ['2009', '2010', '2014', '2018', '지금'];
function yearBar(spec, t, d) {
  if (!spec) return;
  YEARS = (EP && EP.years) || ['2009', '2010', '2014', '2018', '지금'];
  let cur = YEARS.indexOf(spec), from = cur, prog = 1;
  if (spec.includes('>')) { const [a, b] = spec.split('>'); from = YEARS.indexOf(a); cur = YEARS.indexOf(b); prog = ease((t - 0.3) / (d * 0.6)); }
  const x0 = 150, x1 = 930, y = 330, n = YEARS.length, pos = i => lerp(x0, x1, i / (n - 1));
  ctx.fillStyle = '#000'; ctx.fillRect(x0 - 6, y - 6, x1 - x0 + 12, 24);
  ctx.fillStyle = '#3a3f4b'; ctx.fillRect(x0, y, x1 - x0, 12);
  const fx = lerp(pos(from), pos(cur), prog);
  ctx.fillStyle = '#e8d44d'; ctx.fillRect(x0, y, fx - x0, 12);
  YEARS.forEach((yr, i) => {
    const on = pos(i) <= fx + 1, now = Math.abs(pos(i) - fx) < 2;
    box(pos(i) - 15, y - 9, 30, 30, on ? '#e8d44d' : '#3a3f4b', '#000', 6);
    text(yr, pos(i), y + 84, now ? 54 : 42, now ? '#ffe45c' : (on ? '#cfc9a0' : '#6b7080'), 'G14', 'center', 9);
  });
}

// ---------- 자막: 아래쪽 흰 글씨 + 검은 테두리, 마지막 줄 1240px ----------
function subtitle(s) {   // '|' = 정한 줄바꿈 (운영자 2026-11-22 "자막 잘 배치"). 그래도 넓으면 반으로 나눔
  if (!s) return;
  ctx.font = '62px G11B';
  const lines = [];
  for (const part of s.split('|')) {
    if (ctx.measureText(part).width <= 940) { lines.push(part); continue; }
    const w = part.split(' '); let best = 1, bd = 1e9;
    for (let k = 1; k < w.length; k++) { const dd = Math.abs(ctx.measureText(w.slice(0, k).join(' ')).width - ctx.measureText(w.slice(k).join(' ')).width); if (dd < bd) { bd = dd; best = k; } }
    lines.push(w.slice(0, best).join(' '), w.slice(best).join(' '));
  }
  lines.forEach((l, i) => text(l, W / 2, 1240 - (lines.length - 1 - i) * 82, 62, '#fff', 'G11B', 'center', 14));
}
window.subWidths = (subs) => { ctx.font = '62px G11B'; return subs.map(s => s.split('|').map(x => Math.round(ctx.measureText(x).width))); };

// ---------- 우리 픽셀 그림 ----------
const PAL_SP = {y: '#f2d64b', Y: '#c9a92c', g: '#4fa34a', G: '#2f6e2c', h: '#8f7a1f'};
const KITCHEN = [
  'GGGGGGGGGGGGGGGG', 'GggggggggggggggG', 'GggGgggGggggGggG', 'GGGGGGGGGGGGGGGG',
  'yyyyyyyyyyyyyyyy', 'yyhyyyyyhyyyyhyy', 'yyyyyhyyyyyyyyyy', 'yhyyyyyyyhyyyhyy', 'yyyyyyhyyyyyyyyy', 'YYYYYYYYYYYYYYYY'];
const PAL_SEA = {o: '#e9a43a', O: '#b8741f', d: '#6a3d10', l: '#ffd07a'};
const SEA = [
  '.....oo.........', '....oddo........', '....oOOo....oo...', '....olOo...oddo..', '..oooOOo...oOOo..',
  '.oddoOdo...olOo..', '.oOOoOOo...oOOo..', '.olOoOlo...oOdo..', '.oOOoOOo..ooOOo..', '.oOdoOOoo.oOOlo..',
  '.oOOoOdOo.oOOOo..', '.oOlOOOOoooOdOo..', '.ooOOOOlOOOOOOo..', '..oOdOOOOOOlOoo..', '..ooOOOOdOOOOo...', '...oooooooooo....'];
const PAL_EG = {w: '#d9d6c8', W: '#a8a493', e: '#e86c2c', k: '#2a2520', s: '#8c8778'};
const GUARD = [
  '....s...s...s.......', '...sws.sws.sws......', '..wwwwwwwwwwwwww....', '.wwWWWWWWWWWWWWww...',
  'swWWkkkWWWWWWWWWws..', 'wWWkeekWWWWWWWWWWwww', 'wWWkeekWWWWWWWWWWwWw', 'swWWkkkWWWWWWWWWws..',
  '.wwWWWWWWWWWWWWww...', '..wwwwwwwwwwwwww....', '...sws.sws.sws......', '....s...s...s.......'];
const QM = ['.yyyy.', 'yy..yy', '....yy', '...yy.', '..yy..', '......', '..yy..'];
const HEART = ['.rr.rr.', 'rrrrrrr', 'rrrrrrr', '.rrrrr.', '..rrr..', '...r...'];
const BRAIN = ['..pppp..', '.pPpPpp.', 'ppPpppPp', 'pPpppPpp', '.ppPppp.', '..pp.pp.'];
const XMARK = ['x...x', '.x.x.', '..x..', '.x.x.', 'x...x'];

function waterPool(n, S, ox, oy, keep, z = 1) {   // n×n 물 (keep(i,j) → 0~1 크기)
  const cells = [];
  for (let i = 0; i < n; i++) for (let j = 0; j < n; j++) cells.push([i, j]);
  cells.sort((a, b) => (a[0] + a[1]) - (b[0] + b[1]));
  for (const [i, j] of cells) { const s = keep(i, j); if (s > 0.02) cube(IMG.water, i - (n - 1) / 2, j - (n - 1) / 2, z, S, ox, oy, 0.92, s); }
}
function grassFloor(n, S, ox, oy) {
  for (let s = 0; s <= 2 * (n - 1); s++) for (let i = 0; i < n; i++) { const j = s - i; if (j < 0 || j >= n) continue; cube(IMG.grass, i - (n - 1) / 2, j - (n - 1) / 2, 0, S, ox, oy); }
}
function drops(cx, cy, t, n = 10, seed = 3) {   // 젖은 블록 물방울
  const r = rnd(seed);
  for (let k = 0; k < n; k++) { const x = cx + (r() - 0.5) * 220, ph = (t * 0.9 + r()) % 1; ctx.fillStyle = '#4d7bdc'; ctx.fillRect(snap(x), snap(cy + ph * 260), 12, 18); }
}
function steam(cx, cy, p, seed = 5) {
  const r = rnd(seed);
  for (let k = 0; k < 18; k++) { const a = clamp(1 - p); const x = cx + (r() - 0.5) * 200 * (0.4 + p), y = cy - p * (180 + r() * 160); ctx.fillStyle = `rgba(235,235,235,${a})`; const s = 18 + r() * 24; ctx.fillRect(snap(x), snap(y), s, s); }
}

function crack(cx, cy, p, seed, sc = 1) {   // 유리처럼 금 (흰 선)
  const r = rnd(seed); ctx.strokeStyle = '#f4f0ff'; ctx.lineWidth = 8 * sc; ctx.lineCap = 'square';
  for (let k = 0; k < 7; k++) {
    let x = cx, y = cy, ang = (k / 7) * Math.PI * 2 + r(); ctx.beginPath(); ctx.moveTo(x, y);
    const steps = Math.floor(4 * p) + 1;
    for (let s2 = 0; s2 < steps; s2++) { ang += (r() - 0.5) * 0.9; x += Math.cos(ang) * 60 * sc; y += Math.sin(ang) * 60 * sc; ctx.lineTo(snap(x), snap(y)); }
    ctx.stroke();
  }
}
function shards(cx, cy, q, seed) {   // 깨진 조각이 흩어짐
  const r = rnd(seed);
  for (let k = 0; k < 40; k++) {
    const a = r() * Math.PI * 2, v = 300 + r() * 600, x = cx + Math.cos(a) * v * q, y = cy + Math.sin(a) * v * q + 500 * q * q, s3 = 18 + r() * 30;
    ctx.fillStyle = r() > 0.7 ? '#8a7aa8' : (r() > 0.5 ? '#3a2c55' : '#14101a'); ctx.fillRect(snap(x), snap(y), s3, s3);
  }
}
function smoke(cx, cy, q, seed) {
  const r = rnd(seed);
  for (let k = 0; k < 36; k++) {
    const a = r() * Math.PI * 2, v = 120 + r() * 380, e = 1 - Math.exp(-q * 4);
    const x = cx + Math.cos(a) * v * e, y = cy + Math.sin(a) * v * e * 0.6 - q * 80, g = 200 + r() * 40;
    ctx.fillStyle = `rgba(${g},${g},${g},${clamp(1 - q / 1.6)})`; const s3 = 30 + r() * 40; ctx.fillRect(snap(x), snap(y), s3, s3);
  }
}
const VOLC = [
  '.........yrry.........', '........ryrryr........', '.......bbrrrrbb.......', '......bbBrrrBbbb......', '.....bbbBBrBBbbbb.....',
  '....bbbBBbbbBBbbbb....', '...bbbbBbbbbbBbbbbb...', '..bbbbBbbbbbbbBbbbbb..', '.bbbbbbbbbbbbbbbbbbbb.', 'bbbbbbbbbbbbbbbbbbbbbb'];
const SHARD = ['.....k......', '....kpk.....', '....kpwk....', '...kppwk....', '...kpppwk...', '..kpppppwk..', '..kppppppwk.', '.kpppppppwk.', '.kppppppppwk', 'kkkkkkkkkkkk'];
const SCALPEL = ['..........s.', '.........ss.', '........sSs.', '.......sSs..', '......sSs...', '.....hh.....', '....hh......', '...hh.......', '..hh........', '.hh.........'];
const PAINT = [   // 노란 물감 통 (우리 그림): 손잡이 + 넘치는 물감
  '....kkkkkk....', '...k......k...', '..k........k..', '.kkkkkkkkkkkk.', 'kyyyyyyyyyyyyk', 'kyYyyyyyyyYyyk', 'kgyyGGGGGGyGgk',
  'kgyGGGGGGGyGgk', 'kgyGGGGGGGGGgk', 'kggGGGGGGGGGgk', 'kgGGGGGGGGGGgk', 'kgGGGGGGGGGGgk', 'kggggggggggggk', '.kkkkkkkkkkkk.'];
const BURST = ['...y...y...', 'y..yo.oy..y', '.yooooooy..', '..ooyyyo...', 'yyoyyyyyoyy', '..ooyyyoo..', '.yoooooooy.', 'y..yo.oy..y', '...y...y...'];   // 때리는 충격 (우리 그림, 손 대신 운영자 2026-11-23)
const FIST = [   // 주먹 (안 씀)
  '..kkkkkkk.', '.kssksskk.', 'kssssssssk', 'kSssssssSk', 'kSSssssSSk', 'kssssssssk', '.kssssssk.', '..kkkkkk..'];
const DYNA = [   // 다이너마이트 묶음 (우리 그림)
  '.....f.....', '......f....', '.....y.....', '.rrr.rrr.rr', '.rRr.rRr.rR', '.rRr.rRr.rR', 'wwwwwwwwwww', '.rRr.rRr.rR',
  '.rRr.rRr.rR', '.rRr.rRr.rR', 'wwwwwwwwwww', '.rRr.rRr.rR', '.rrr.rrr.rr'];
const THERMO = ['.kkk.', '.kwk.', '.kwk.', '.kwk.', '.krk.', '.krk.', '.krk.', 'kkrkk', 'krrrk', 'krrrk', '.kkk.'];
function splat(cx, cy, q, seed) {   // 노란 물감 튐
  const r = rnd(seed);
  for (let k = 0; k < 26; k++) { const a = r() * Math.PI * 2, v = 120 + r() * 300, e = 1 - Math.exp(-q * 6);
    ctx.fillStyle = r() > 0.5 ? '#ffd23a' : '#d9a514'; const s3 = 16 + r() * 22; ctx.fillRect(snap(cx + Math.cos(a) * v * e), snap(cy + Math.sin(a) * v * e * 0.7), s3, s3); }
}
function slot(x, y, cs) {   // 인벤토리 칸
  ctx.fillStyle = '#373737'; ctx.fillRect(x + 4, y + 4, cs - 8, 6); ctx.fillRect(x + 4, y + 4, 6, cs - 8);
  ctx.fillStyle = '#fff'; ctx.fillRect(x + 4, y + cs - 10, cs - 8, 6); ctx.fillRect(x + cs - 10, y + 4, 6, cs - 8);
  ctx.fillStyle = '#8b8b8b'; ctx.fillRect(x + 10, y + 10, cs - 20, cs - 20);
}
function craftGrid(x0, y0, cs, at) {   // 3×3 조합 칸, at(r, c) → 이미지 또는 null
  box(x0 - 16, y0 - 16, 3 * cs + 32, 3 * cs + 32, '#c6c6c6', '#000', 6);
  for (let r = 0; r < 3; r++) for (let c = 0; c < 3; c++) {
    const x = x0 + c * cs, y = y0 + r * cs; slot(x, y, cs);
    const im = at(r, c); if (im) ctx.drawImage(im, x + 18, y + 18, cs - 36, cs - 36);
  }
}
function arrow(x, y) {   // 조합 화살표 (픽셀)
  ctx.fillStyle = '#000'; ctx.fillRect(x - 6, y - 24, 102, 48); ctx.fillRect(x + 84, y - 48, 12, 96);
  ctx.fillStyle = '#e8e8e8'; ctx.fillRect(x, y - 18, 90, 36);
  for (let k = 0; k < 5; k++) ctx.fillRect(x + 84 + k * 12, y - 42 + k * 12, 12, 84 - k * 24);
}
function cmdBar(s) {   // 명령어 창 (가운데 기준)
  box(-400, -60, 800, 100, '#1b1b1b', '#000', 6);
  text(s, -370, 6, 50, '#e0e0e0', 'G14', 'left', 0);
}
const FLAME = [   // 현실 불꽃 (우리 그림, 물건 없이 불꽃만)
  '....o.....', '...oo.....', '...ooo..o.', '..oyoo.oo.', '..oyyoooo.', '.ooyyyoooo', '.oyyyyyoo.',
  'ooyywyyyoo', 'oyywwwyyyo', 'oyywwwwyyo', 'oyyywwyyyo', '.oyyyyyyo.', '..oyyyyo..', '...oooo...'];
// ---------- 장면 ----------
const SC = {
  hook(t, d) {
    bg();
    const y = 520 + Math.sin(t * 3) * 10;
    cube(IMG.sp3, 0, 0, 0, 560, W / 2, y);
    const p = back((t - 0.5) / 0.35);
    if (p > 0) {
      ctx.save(); ctx.translate(W / 2, y + 300);
      for (const ang of [-0.5, 0.5]) {
        ctx.save(); ctx.rotate(ang); ctx.scale(p, p);
        ctx.fillStyle = '#000'; ctx.fillRect(-336, -54, 672, 108);
        ctx.fillStyle = '#d8cfae'; ctx.fillRect(-330, -48, 660, 96);
        ctx.fillStyle = '#bfb48e'; for (let x = -324; x < 324; x += 48) ctx.fillRect(x, -48, 12, 96);
        ctx.restore();
      }
      ctx.restore();
    }
  },
  flood(t, d) {
    bg();
    const S = 120, ox = W / 2, oy = 680, n = 6;
    grassFloor(n, S, ox, oy);
    const r = rnd(7), order = [];
    for (let z = 1; z <= 2; z++) for (let i = 0; i < n; i++) for (let j = 0; j < n; j++) order.push([i, j, z, r()]);
    order.sort((a, b) => a[2] - b[2] || a[3] - b[3]);
    const shown = Math.floor(clamp(t / (d * 0.85)) * order.length);
    const vis = order.slice(0, shown).sort((a, b) => (a[0] + a[1]) - (b[0] + b[1]) || a[2] - b[2]);
    for (const [i, j, z] of vis) cube(IMG.water, i - (n - 1) / 2, j - (n - 1) / 2, z, S, ox, oy, 0.9);
  },
  drop(t, d) {
    bg();
    const S = 120, ox = W / 2, oy = 700, n = 5;
    grassFloor(n, S, ox, oy);
    const land = 0.6, hit = t > land;
    const R = hit ? (t - land) / (d * 0.45) * 4 : -1;
    waterPool(n, S, ox, oy, (i, j) => { const dd = Math.abs(i - 2) + Math.abs(j - 2); if (i === 2 && j === 2) return 0; return clamp(1 - (R - dd + 1)); });
    const fy = hit ? 0 : -(1 - t / land) * 900;
    cube(IMG.sp1, 0, 0, 1, S, ox, oy + fy);
  },
  bubble(t, d) {
    bg();
    cube(IMG.sp1, 0, 0, 0, 250, 290, 800);
    const p = back(t / 0.4);
    ctx.save(); ctx.translate(620, 680); ctx.scale(p, p);
    box(-330, -150, 660, 260, '#f4f1e6', '#000', 9);

        if (!k) { if (Math.floor(t * 3) % 2 === 0) { ctx.strokeStyle = '#ffe45c'; ctx.lineWidth = 8; ctx.strokeRect(x + 6, y + 6, cs - 12, cs - 12); } sprite(QM, {y: '#ffe45c'}, x + cs / 2, y + cs / 2, 12); return; }
        const im = IMG[k];
        if (im.width === im.height && im.width >= 300) cube(im, 0, 0, 0, 84, x + cs / 2, y + 14); else ctx.drawImage(im, x + 20, y + 20, cs - 40, cs - 40);
      });
      text('크리에이티브 목록', W / 2, 970, 80, '#fff', 'G14', 'center', 12);
      return;
    }
    cube(IMG.nrc, 0, 0, 0, 280, W / 2, 380, 0.6);
    ctx.save(); ctx.translate(W / 2, 780); cmdBar('/give nether_reactor'); ctx.restore();
    if (t > s1 + 0.4) bigX(W / 2 + 330, 765, clamp((t - s1 - 0.4) / 0.15));
    text('명령어 X', W / 2, 970, 90, '#ff5a4a', 'G14', 'center', 12);
  },
  // ---------- 소울 샌드 편 (운영자 2026-11-23) ----------
  shook(t, d) {
    bg();
    const s1 = subAt(1, d * 0.5), S = lerp(420, 520, ease(t / (d * 0.8)));
    cube(IMG.soulsand, 0, 0, 0, S, W / 2, 380 + (520 - S) * 0.4);
    const q = back((t - s1) / 0.35);
    if (q > 0) { ctx.save(); ctx.translate(W / 2, 300); ctx.scale(q, q); text('소울 = 영혼 · 샌드 = 모래', 0, 0, 66, '#c9a27a', 'G14', 'center', 10); ctx.restore(); }
  },
  sslow(t, d) {
    bg();
    const T1 = d * 0.42, T2 = T1 * 40 / 23;
    text('100m 걷기', W / 2, 330, 80, '#fff', 'G14', 'center', 10);
    const lanes = [[300, IMG.grass, 23, T1, '#7fd36a'], [780, IMG.soulsand, 40, T2, '#c9a27a']];
    for (const [x, img, sec, TT, col] of lanes) {
      const S = 220, k = S / 268, oy = 520, p = clamp(t / TT);
      cube(img, 0, 0, 0, S, x, oy);
      const st = IMG.steve, h = 200, w = h * st.width / st.height, bob = p < 1 ? Math.abs(Math.sin(t * (sec < 30 ? 14 : 8))) * 10 : 0;
      ctx.drawImage(st, x - w / 2, oy + 57 * k - h - bob + (img === IMG.soulsand ? 10 : 0), w, h);
      box(x - 180, 760, 360, 40, '#2a2d34', '#000', 6);
      ctx.fillStyle = col; ctx.fillRect(x - 180, 760, 360 * p, 40);
      text(`${Math.round(sec * p)}초`, x, 910, p >= 1 ? 96 : 76, p >= 1 ? col : '#fff', 'G14', 'center', 10);
    }
  },
  s2010(t, d) {
    bg();
    const s1 = subAt(1, d * 0.5), S = 160, ox = W / 2, oy = 380, n = 4;
    const pat = (i, j) => ((i * 3 + j * 5) % 4 === 0 || (i + j) % 3 === 0) ? IMG.soulsand : IMG.nether;
    for (let s2 = 0; s2 <= 2 * (n - 1); s2++) for (let i = 0; i < n; i++) { const j = s2 - i; if (j < 0 || j >= n) continue; cube(pat(i, j), i - 1.5, j - 1.5, 0, S, ox, oy); }
    if (t < s1) { text('네더', W / 2, 970, 96, '#ff6a4a', 'G14', 'center', 12); return; }
    const p = back((t - s1) / 0.3);
    ctx.save(); ctx.translate(W / 2, 790); ctx.scale(p, p);
    box(-300, -70, 600, 130, '#e8e8e8', '#000', 6);
    ctx.fillStyle = '#3a6ea8'; ctx.fillRect(-300, -70, 600, 26);
    text('hellsand.png', 0, 36, 56, '#1b1b1b', 'G14', 'center', 0);
    ctx.restore();
    text('지옥 모래', W / 2, 970, 90, '#ff6a4a', 'G14', 'center', 12);
  },
  s2012(t, d) {
    bg();
    const s1 = subAt(1, d * 0.4), s2 = subAt(2, d * 0.75), S = 170, ox = W / 2, oy = 700, k = S / 268;
    if (t >= s2) {
      if (t < s2 + 0.25) flash(`rgba(255,255,255,${0.7 * (1 - (t - s2) / 0.25)})`);
      const p = back((t - s2) / 0.4), h = 560 * p, w = h * IMG.wither.width / IMG.wither.height;
      ctx.drawImage(IMG.wither, W / 2 - w / 2, 900 - h + Math.sin(t * 4) * 8, w, h);
      text('보스 몹 위더', W / 2, 970, 90, '#d0d0d0', 'G14', 'center', 12);
      return;
    }
    const blocks = [[0, 0], [-1, 1], [0, 1], [1, 1]];
    const shown = Math.floor(clamp(t / Math.max(0.4, s1 * 0.8)) * 4 + 0.001);
    // 정면(b=0 평면)에 T자: a = 좌우, c = 높이
    for (let m = 0; m < shown; m++) { const [a, c] = blocks[m]; cube(IMG.soulsand, a, -a, c, S, ox, oy); }
    for (let m = 0; m < 3; m++) if (t >= s1 + m * 0.2) { const a = m - 1; cube(IMG.skull, a, -a, 2, S, ox, oy); }
    text(t < s1 ? 'T자 쌓기' : '위더 스켈레톤 해골 × 3', W / 2, 970, 76, '#c9a27a', 'G14', 'center', 12);
  },
  s2018(t, d) {
    bg();
    const S = 150, ox = W / 2, oy = 740, k = S / 268;
    cube(IMG.soulsand, 0, 0, 0, S, ox, oy);
    for (let c = 1; c <= 4; c++) cube(IMG.water, 0, 0, c, S, ox, oy, 0.55);
    const r = rnd(53);
    for (let m = 0; m < 14; m++) {
      const x = ox - 70 + r() * 140, ph = (t * (0.7 + r() * 0.5) + r()) % 1, y = oy + 40 - ph * 420;
      ctx.drawImage(IMG.bubble, snap(x - 30), snap(y - 30), 60, 60);
    }
    text('거품 기둥', W / 2, 970, 90, '#7fd3f0', 'G14', 'center', 12);
  },
  s2020(t, d) {
    bg();
    const s1 = subAt(1, d * 0.55), S = 220, k = S / 268;
    const items = [[310, IMG.soulsand, IMG.sfire, 1], [770, IMG.nether, IMG.fire, 0.5]];
    for (const [x, base, fire, hearts] of items) {
      const oy = 560;
      cube(base, 0, 0, 0, S, x, oy);
      const fy = oy - 165 * k, sw = Math.floor(t * 8) % 2;
      ctx.save(); if (sw) { ctx.translate(x * 2, 0); ctx.scale(-1, 1); }
      ctx.drawImage(fire, x - 150 * k, fy - 28 * k, 300 * k, 328 * k);
      ctx.restore();
      if (t >= s1) {
        const hx = x, hy = 830;
        ctx.save(); ctx.beginPath(); ctx.rect(hx - 60, hy - 60, hearts >= 1 ? 120 : 60, 120); ctx.clip();
        sprite(HEART, {r: '#ff3b30'}, hx, hy, 16); ctx.restore();
        if (hearts < 1) { ctx.globalAlpha = 0.35; ctx.save(); ctx.beginPath(); ctx.rect(hx, hy - 60, 60, 120); ctx.clip(); sprite(HEART, {r: '#555'}, hx, hy, 16); ctx.restore(); ctx.globalAlpha = 1; }
      }
    }
    if (t >= s1) text('피해 2배', W / 2, 970, 90, '#7fd3f0', 'G14', 'center', 12);
    else text('영혼 불', W / 2, 970, 90, '#7fd3f0', 'G14', 'center', 12);
  },
  sreal(t, d) {
    bg();
    const s1 = subAt(1, d * 0.45), sw = Math.floor(t * 7) % 2;
    const fl = (x, pal) => { ctx.save(); if (sw) { ctx.translate(x * 2, 0); ctx.scale(-1, 1); } sprite(FLAME, pal, x, 560, 30); ctx.restore(); };
    fl(300, {o: '#e8611a', y: '#ffb02e', w: '#fff1a8'});
    fl(780, {o: '#1f6fe0', y: '#5fb8ff', w: '#e6f6ff'});
    if (t >= s1) {
      const r = rnd(61);
      for (let m = 0; m < 10; m++) { const ph = (t * 0.8 + r()) % 1, side = r() > 0.5 ? 1 : -1, x = 780 + side * lerp(300, 40, ph), y = 780 - ph * 120 + r() * 40; ctx.fillStyle = '#cfe9ff'; ctx.fillRect(snap(x), snap(y), 18, 18); }
      text('O₂', 980, 800, 54, '#cfe9ff', 'G14', 'center', 9);
      text('덜 탐', 300, 860, 66, '#ffb02e', 'G14', 'center', 10);
      text('다 탐', 780, 860, 66, '#5fb8ff', 'G14', 'center', 10);
      text('완전 연소', W / 2, 970, 90, '#5fb8ff', 'G14', 'center', 12);
    }
  },
  cover(t, d) {   // 표지: 블록 이름 하나 + 블록 크게 (운영자 2026-11-22 "스펀지. 이렇게 간단하게")
    bg();
    // 제목+블록 묶음을 화면 가운데로 (운영자 2026-11-23 '썸네일 가운데로')
    cube(IMG[(EP && EP.coverBlock) || 'sp3'], 0, 0, 0, 600, W / 2, 785);
    text((EP && EP.title) || '', W / 2, 685, (EP && EP.coverSize) || 230, (EP && EP.coverColor) || '#ffe45c', 'G14', 'center', 22);   // 제목 색 = 블록 색 (운영자 2026-11-23 흑요석은 보라)
  },
  follow(t, d) {
    bg('#07070a', '#0d0d12', 0.02);
    ctx.save(); ctx.shadowColor = 'rgba(200,230,255,0.45)'; ctx.shadowBlur = 50;
    cube(IMG[(EP && EP.nextBlock) || 'obs'], 0, 0, 0, 440, W / 2, 560, 0.85);
    ctx.restore();
    const a = clamp(t / 0.5);
    ctx.globalAlpha = a; text('팔로우', W / 2, 1040, 64, '#d9d0ff', 'G14', 'center', 10); ctx.globalAlpha = 1;
  },
};

const STAGE_DY = 190, STAGE_SC = 0.9, BAR_BOTTOM = 440;
window.CUR = null;
const subAt = (k, dflt) => (CUR && CUR.subs && CUR.subs[k]) ? CUR.subs[k][1] : dflt;   // k번째 자막이 나오는 때에 장면 바꾸기
function bigX(cx, cy, a) { ctx.globalAlpha = a; for (const [c, w] of [['#000', 34], ['#ff3b30', 20]]) { ctx.strokeStyle = c; ctx.lineWidth = w; ctx.lineCap = 'butt'; ctx.beginPath(); ctx.moveTo(cx - 70, cy - 70); ctx.lineTo(cx + 70, cy + 70); ctx.moveTo(cx + 70, cy - 70); ctx.lineTo(cx - 70, cy + 70); ctx.stroke(); } ctx.globalAlpha = 1; }
window.EP = null;   // make.py가 넣음: {scenes: [{scene, year, d, subs: [[text, t0, t1]]}]}
window.renderAt = (idx, t, d, sub, year) => {
  const sc = EP ? EP.scenes[idx] : null;
  const name = sc ? sc.scene : idx; window.CUR = sc;
  ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.imageSmoothingEnabled = false;
  window.YEAR_OV = undefined;
  ctx.save();
  if (name !== 'cover') {   // 그림을 화면 가운데 쪽으로: 아래로 내리고 살짝 줄임 (운영자 2026-11-23 '그림 좀 내리자, 앞으로도 중앙에')
    if (sc && sc.year) { bg(); ctx.beginPath(); ctx.rect(0, BAR_BOTTOM, W, H - BAR_BOTTOM); ctx.clip(); }   // 연도 띠와 절대 안 겹치게
    ctx.translate(W * (1 - STAGE_SC) / 2, STAGE_DY); ctx.scale(STAGE_SC, STAGE_SC);
  }
  SC[name](t, d);
  ctx.restore();
  yearBar(year !== undefined ? year : (window.YEAR_OV !== undefined ? window.YEAR_OV : (sc && sc.year)), t, d);
  subtitle(sub);
};
window.renderTimeline = (T) => {
  let acc = 0;
  for (let i = 0; i < EP.scenes.length; i++) {
    const s = EP.scenes[i];
    if (T < acc + s.d || i === EP.scenes.length - 1) {
      const t = T - acc, cur = (s.subs || []).find(x => t >= x[1] && t < x[2]);
      renderAt(i, t, s.d, cur ? cur[0] : '');
      return;
    }
    acc += s.d;
  }
};
</script></body></html>
