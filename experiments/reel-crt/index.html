<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<link rel="stylesheet" href="fonts/black-han-sans/index.css">
<style>
@font-face{font-family:'Wanted';src:url('fonts/WantedSans-Medium.otf');font-weight:500}
@font-face{font-family:'Wanted';src:url('fonts/WantedSans-Bold.otf');font-weight:700}
@font-face{font-family:'Wanted';src:url('fonts/WantedSans-ExtraBold.otf');font-weight:800}
@font-face{font-family:'JBM';src:url('fonts/jetbrains-mono-latin-700-normal.woff2');font-weight:700}
@font-face{font-family:'JBM';src:url('fonts/jetbrains-mono-latin-800-normal.woff2');font-weight:800}
:root{--g:#00FF66;--ink:#0A0B0A;--iv:#F2F4F0;--mut:#8FA89A}
*{box-sizing:border-box;margin:0}
html,body{width:1080px;height:1920px;background:var(--ink);overflow:hidden}
#stage{position:absolute;inset:0;font-family:'Wanted',sans-serif;color:var(--iv);word-break:keep-all}
.d{font-family:'Black Han Sans','Wanted',sans-serif;font-weight:400}
#bug{position:absolute;left:64px;top:292px;display:flex;align-items:center;gap:16px}
#bug b{background:var(--g);color:var(--ink);font-family:'Black Han Sans';font-weight:400;font-size:34px;line-height:1;padding:10px 14px 8px}
#bug span{font-size:26px;font-weight:700;color:#B9C2BD}
#title{position:absolute;left:64px;right:64px;top:352px;font-size:54px;line-height:1.15;letter-spacing:-.02em;white-space:nowrap}
#title i{font-style:normal;color:var(--g)}
#band{position:absolute;left:0;top:432px;width:1080px;height:608px;overflow:hidden;background:#161616}
#band canvas{position:absolute;inset:0}
#credit{position:absolute;right:20px;top:18px;font-size:22px;font-weight:700;color:#E3E7E4;background:rgba(0,0,0,.55);padding:6px 10px}
/* 영상 위: 평범한 자막 */
#sub{position:absolute;left:40px;right:40px;bottom:24px;text-align:center;font-size:42px;font-weight:800;line-height:1.38;color:#fff;
  text-shadow:0 0 6px #000,0 0 3px #000,0 2px 10px rgba(0,0,0,.9);white-space:pre-line}
/* 아래 빈칸: 모션 (오른쪽 인스타 버튼 자리 x>940은 비운다) */
#mo{position:absolute;left:64px;width:876px;top:1246px;height:420px}
#who{position:absolute;left:64px;top:1192px;font-size:24px;font-weight:700;color:var(--mut)}
#who b{color:var(--iv)}
.eb{font-size:26px;font-weight:800;color:var(--g);letter-spacing:.04em}
.kk{font-size:40px;font-weight:800;line-height:1.3}
.blk{display:inline-block;background:var(--g);color:var(--ink);font-family:'Black Han Sans';line-height:1;letter-spacing:-.03em;padding:.12em .16em .02em}
.lab{font-size:38px;font-weight:700;color:#DDE3DF;margin-top:18px}
.vs{display:flex;align-items:flex-end;gap:30px;margin-top:26px}
.vs .c .l{font-size:30px;font-weight:700;color:var(--mut);margin-bottom:10px}
.vs .c .n{font-family:'Black Han Sans';font-size:120px;line-height:1;letter-spacing:-.03em}
.vs .arr{font-family:'Black Han Sans';font-size:90px;color:var(--mut);padding-bottom:10px}
.stamp{position:absolute;right:20px;top:250px;font-family:'Black Han Sans';font-size:80px;line-height:1;background:var(--g);color:var(--ink);padding:16px 22px 8px;transform-origin:50% 50%}
.br{display:grid;grid-template-columns:110px 1fr 240px;align-items:center;gap:20px;margin-top:30px}
.br .l{font-family:'Black Han Sans';font-size:48px}
.br .tr{height:64px;background:#1B231F;position:relative}
.br .tr i{position:absolute;left:0;top:0;bottom:0;background:var(--g)}
.br .v{font-family:'Black Han Sans';font-size:54px;color:var(--g);white-space:nowrap}
.br.dim .tr i{background:#4A5A50}.br.dim .v{color:var(--mut)}
</style></head>
<body><div id="stage">
  <div id="bug"><b>TOKEN WAR</b><span>AI 뉴스</span></div>
  <div id="title" class="d"></div>
  <div id="band"><canvas id="cv" width="1080" height="608"></canvas><div id="credit"></div><div id="sub"></div></div>
  <canvas id="term" width="1080" height="300" style="position:absolute;left:0;top:1040px"></canvas>
</div>
<script src="term.js"></script>
<script src="main.js"></script>
</body></html>
