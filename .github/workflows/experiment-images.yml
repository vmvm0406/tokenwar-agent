name: 실험 그림 (임시)

# 손으로만 실행. experiments/slime-test/gen.py로 AI 그림을 만들어 커밋한다. 실험이 끝나면 지운다.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  gen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q requests pillow
      - name: 그림 만들기
        env:
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
        run: python experiments/slime-test/gen.py
      - name: 결과 커밋
        run: |
          git config user.name "tokenwar-bot"
          git config user.email "tokenwar-bot@users.noreply.github.com"
          git add experiments/slime-test
          git diff --cached --quiet && exit 0
          git commit -m "실험: 슬라임 캐릭터 조명 4장 결과"
          for i in 1 2 3; do git pull --rebase && git push && break; sleep 5; done
