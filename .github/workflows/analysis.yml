name: 벤치마크 패턴 분석

# '인스타 반응 분석'(benchmarks.yml)이 끝나면, 저장된 데이터로만 코드 분석을 한다 (AI 없음, Graph API 호출 없음).
# - agent/peer_followers.py: 벤치마크 계정 팔로워를 날짜별로 data/followers_peers.csv에 쌓는다
# - agent/patterns.py: 평소보다 잘 된 형식·첫 줄·시간·자료 DM·주제 → data/benchmark_patterns.md
on:
  workflow_run:
    workflows: ["인스타 반응 분석"]
    types: [completed]
  push:
    paths: [".github/workflows/analysis.yml", "agent/patterns.py", "agent/peer_followers.py"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: analysis
  cancel-in-progress: false

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q requests   # benchmarks.py를 import만 한다 (API는 부르지 않음)
      - name: 분석
        run: |
          git pull --rebase --quiet origin main || true
          python agent/peer_followers.py
          python agent/patterns.py
      - name: 저장
        run: |
          git config user.name "tokenwar-bot"
          git config user.email "tokenwar-bot@users.noreply.github.com"
          git add data/followers_peers.csv data/benchmark_patterns.md
          if git diff --cached --quiet; then echo "바뀐 것 없음"; else
            git commit -m "벤치마크 패턴·팔로워 기록 갱신" && bash scripts/push-retry.sh; fi
