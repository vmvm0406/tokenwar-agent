name: 인스타 게시

on:
  push:
    branches: [main]
    paths: ["posts/queue/**"]
  schedule:
    # 15분마다 게시 시각이 된 게시물이 있는지 확인 (UTC 기준, 실제 실행은 몇 분 늦을 수 있음)
    - cron: "*/15 * * * *"
  workflow_dispatch:

concurrency:
  group: publish
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install requests

      - name: 게시
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
        run: python agent/publish.py

      - name: 결과 저장 (게시된 폴더 이동, 오류 기록)
        if: always()
        run: |
          git config user.name "tokenwar-bot"
          git config user.email "tokenwar-bot@users.noreply.github.com"
          git add -A posts
          if git diff --cached --quiet; then
            echo "바뀐 것 없음"
          else
            git commit -m "게시 결과 기록"
            git pull --rebase
            git push
          fi
