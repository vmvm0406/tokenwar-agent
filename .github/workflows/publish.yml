name: 인스타 게시

on:
  push:
    branches: [main]
    paths: ["posts/queue/**"]
  schedule:
    # 15분마다 게시 시각이 된 게시물이 있는지 확인 (UTC 기준, 실제 실행은 몇 분 늦을 수 있음)
    - cron: "*/15 * * * *"
  workflow_dispatch:

concurrency:
  group: publish
  cancel-in-progress: false

permissions:
  contents: write
  # dm 게시물이 올라가면 "Zorcha 설정 필요" 이슈를 연다 (agent/publish.py notify_zorcha, 운영자에게 메일)
  issues: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # 기다렸다 도는 실행도 그때의 최신 main을 받는다. 예전 커밋을 받으면 이미 올린 게시물을 또 올림 (2026-11-16 힌턴 릴스 중복)
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # imageio-ffmpeg: 60초 넘는 릴스를 스토리용으로 앞 59.5초만 자를 때 (agent/publish.py story_media)
      - run: pip install requests pillow imageio-ffmpeg

      - name: git 사용자 (게시할 미디어를 docs/media로 push할 때 씀)
        run: |
          git config user.name "tokenwar-bot"
          git config user.email "tokenwar-bot@users.noreply.github.com"

      # 미디어는 docs/media에 복사·push → GitHub Pages 주소로 인스타에 넘긴다 (agent/publish.py 맨 위 설명)
      - name: 게시
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_API_HOST: ${{ vars.IG_API_HOST }}
          # 스레드(선택): 없으면 스레드 단계는 조용히 건너뛴다. 인스타 게시 + threads_delay_min 뒤 실행에서 올림 (agent/threads.py)
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
        run: python agent/publish.py

      - name: 결과 저장 (게시된 폴더 이동, 오류·스레드 결과 기록, Zorcha 할 일, docs/media 비우기)
        if: always()
        run: |
          git add -A posts docs
          if [ -f data/zorcha_todo.md ]; then git add data/zorcha_todo.md; fi
          if git diff --cached --quiet; then
            echo "바뀐 것 없음"
          else
            git commit -m "게시 결과 기록"
            bash scripts/push-retry.sh
          fi
