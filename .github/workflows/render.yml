name: 그림 만들기·렌더링

# posts/queue에 게시물이 올라오거나 고쳐지면 (main이든 검토용 브랜치든)
# AI 그림을 만들고(Cloudflare), 카드·릴스를 렌더링해서 같은 브랜치에 커밋한다.
on:
  push:
    paths: ["posts/queue/**"]
  workflow_dispatch:

concurrency:
  group: render-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 도구 설치
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          pip install -q requests pillow playwright
          # 러너에 깔린 google-chrome을 쓴다. 없을 때만 Playwright 브라우저를 받는다.
          which google-chrome || python -m playwright install --with-deps chromium

      - name: 그림 만들기 + 렌더링
        env:
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
        run: python agent/build.py

      - name: 결과 커밋
        run: |
          git config user.name "tokenwar-bot"
          git config user.email "tokenwar-bot@users.noreply.github.com"
          git add -A posts/queue docs
          if git diff --cached --quiet; then
            echo "바뀐 것 없음"
          else
            git commit -m "그림·렌더링 결과"
            git pull --rebase
            git push
          fi
