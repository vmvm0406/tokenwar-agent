name: 스토리 한꺼번에 올리기

# 지금 인스타에 올라가 있는 게시물 중 스토리가 없는 것을 오래된 것부터 스토리로 올린다 (agent/publish.py --stories-backfill).
# 새 게시물은 publish.yml이 피드 게시 직후 스토리도 올리므로, 이건 손으로 한 번씩만 돌린다.
# 인스타에서 지운 게시물(인스타 게시물 목록에 없음)과 published.json에 status가 있는 게시물은 건너뛴다.
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "시험만 (올리지 않고 목록·요청만 출력)"
        type: boolean
        default: true
      gap_min:
        description: "스토리 사이 간격(분)"
        default: "2"
      limit:
        description: "앞에서부터 이 개수만 (0이면 전부)"
        default: "0"

# publish.yml과 같은 그룹: docs/media를 같이 쓰므로 동시에 돌지 않게
concurrency:
  group: publish
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install requests pillow imageio-ffmpeg

      - name: git 사용자
        run: |
          git config user.name "tokenwar-bot"
          git config user.email "tokenwar-bot@users.noreply.github.com"

      - name: 스토리 올리기
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_API_HOST: ${{ vars.IG_API_HOST }}
          DRY_RUN: ${{ inputs.dry_run && '1' || '' }}
          STORY_GAP_MIN: ${{ inputs.gap_min }}
          STORY_LIMIT: ${{ inputs.limit }}
        run: python agent/publish.py --stories-backfill

      - name: 결과 저장 (published.json의 story_id, docs/media 비우기)
        if: always() && !inputs.dry_run
        run: |
          git add -A posts docs
          if git diff --cached --quiet; then
            echo "바뀐 것 없음"
          else
            git commit -m "스토리 게시 기록"
            bash scripts/push-retry.sh
          fi
