name: 인스타 반응 분석

# 매일 아침 6시(한국 시간), 아침 리서치 전에 벤치마크 계정과 우리 계정의 조회수를 모은다.
on:
  schedule:
    - cron: "7 21 * * *"
  push:
    paths: [".github/workflows/benchmarks.yml", "agent/benchmarks.py", "agent/hot.py", "config.json"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q requests
      - name: 수집
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
        run: |
          python agent/benchmarks.py
          python agent/hot.py
      - name: 저장
        run: |
          git config user.name "tokenwar-bot"
          git config user.email "tokenwar-bot@users.noreply.github.com"
          git add -A data
          if git diff --cached --quiet; then echo "바뀐 것 없음"; else
            git commit -m "인스타 반응 데이터 갱신" && bash scripts/push-retry.sh; fi
