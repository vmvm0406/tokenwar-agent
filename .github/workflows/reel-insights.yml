name: 릴스 시청 지표

# '인스타 반응 분석'(benchmarks.yml)이 끝나면 우리 최근 30일 릴스의 평균 시청 시간·건너뛰기 비율 등을 모은다.
# agent/reel_insights.py → data/reel_insights.json, data/reel_insights.md (API 호출 40회 이하)
on:
  workflow_run:
    workflows: ["인스타 반응 분석"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: reel-insights
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q requests
      - name: ffprobe (릴스 길이 재기)
        run: which ffprobe || (sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg)
      - name: 수집
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_API_HOST: ${{ vars.IG_API_HOST }}
        run: python agent/reel_insights.py
      - name: 저장
        run: |
          git config user.name "tokenwar-bot"
          git config user.email "tokenwar-bot@users.noreply.github.com"
          git add data/reel_insights.json data/reel_insights.md
          if git diff --cached --quiet; then echo "바뀐 것 없음"; else
            git commit -m "릴스 시청 지표 갱신" && bash scripts/push-retry.sh; fi
